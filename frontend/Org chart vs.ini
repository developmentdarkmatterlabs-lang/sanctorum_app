Org chart vs. interaction graph — different
I listed them separately for a reason.
Org chart — the structure. What can happen.
Static, from Role/Position/Agent/Team. A tree. 
Nobody has to run anything for it to be complete — it's the same on a fresh install 
as after a year. Colored by clearance, it makes "capability comes from position" 
a picture instead of a paragraph.

Interaction graph — the behavior. What did happen.
Aggregated from run history. 
A directed graph with weights: Alden → Ebon, 47 delegations, $12.40. 
Empty on a fresh install; only interesting after real use.

Why the difference matters: the value is in comparing them. 
The org chart says Malok reports to Eldrica. 
The interaction graph says that edge has never been used. 
Or: two teams delegate to each other constantly and should probably be one team. 
Neither graph tells you that alone.

Which to build: the org chart, clearly. 
It's structural (always populated), 
's your core idea made visible, 
and it's a tree — d3-hierarchy, not a physics simulation. 
The interaction graph needs months of run history to say anything.