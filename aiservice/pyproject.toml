[project]
name = "sanctorum-aiservice"
version = "0.1.0"
description = "Sanctorum AI service — implements the AgentRuntime contract (Phase 1: solo agent)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Provider-agnostic LLM access (targets OpenRouter through it).
    "litellm>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP client: POSTs RuntimeEvents back to the Node backend, and Serper search.
    "httpx>=0.27",
    "orjson>=3.11.9",
    # Phase 2: LangGraph for the agent graph + interrupt-based supervision, with a
    # SQLite checkpointer so a paused run survives. LangChain provides the tool
    # abstraction + ChatLiteLLM (routes to OpenRouter).
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.1.0",
    # Phase 3.7: connect to external MCP servers and expose their tools to the graph.
    "langchain-mcp-adapters>=0.1.0",
    "trafilatura>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctorum_aiservice"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
