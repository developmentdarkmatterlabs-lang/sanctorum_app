<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <!-- Sanctorum's bulkhead around every page: steel rails, cyan light strips, amber status lights and a portal.
       Glows are gradients, not blur filters: a filter is printed as a picture on every page. -->
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57c7ff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#57c7ff"/>
      <stop offset=".82" stop-color="#57c7ff"/>
      <stop offset="1" stop-color="#57c7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stripH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57c7ff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#57c7ff"/>
      <stop offset=".75" stop-color="#57c7ff"/>
      <stop offset="1" stop-color="#57c7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haloV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57c7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#57c7ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#57c7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haloH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57c7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#57c7ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#57c7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="portalGlow">
      <stop offset="0" stop-color="#57c7ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#57c7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGlow">
      <stop offset="0" stop-color="#f0a832" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f0a832" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the rails -->
  <path d="M14,6 H196 L204,14 V283 L196,291 H14 L6,283 V14 Z" fill="none" stroke="#2c3440" stroke-width=".8"/>
  <path d="M15,8.4 H195 L201.6,15 V282 L195,288.6 H15 L8.4,282 V15 Z" fill="none" stroke="#1b2027" stroke-width=".4"/>

  <!-- cyan light strips, like the entrance's pillars: a soft halo, then the lit core -->
  <rect x="5.2" y="92" width="4" height="113" fill="url(#haloV)" opacity=".9"/>
  <rect x="200.8" y="92" width="4" height="113" fill="url(#haloV)" opacity=".9"/>
  <rect x="34" y="5.2" width="44" height="4" fill="url(#haloH)" opacity=".9"/>
  <rect x="132" y="5.2" width="44" height="4" fill="url(#haloH)" opacity=".9"/>
  <g opacity=".95">
    <rect x="6.95" y="92" width=".5" height="113" rx=".25" fill="url(#strip)"/>
    <rect x="202.55" y="92" width=".5" height="113" rx=".25" fill="url(#strip)"/>
    <rect x="34" y="6.95" width="44" height=".5" rx=".25" fill="url(#stripH)"/>
    <rect x="132" y="6.95" width="44" height=".5" rx=".25" fill="url(#stripH)"/>
  </g>

  <!-- the portal at the top -->
  <circle cx="105" cy="7.2" r="9" fill="url(#portalGlow)"/>
  <circle cx="105" cy="7.2" r="5" fill="#0b0d10" stroke="#2c3440" stroke-width=".6"/>
  <circle cx="105" cy="7.2" r="3.4" fill="none" stroke="#57c7ff" stroke-width=".5"/>
  <g fill="none" stroke="#9fe0ff" stroke-width=".35" stroke-linecap="round">
    <path d="M105,4.6 A2.6,2.6 0 0 1 107.6,7.2"/>
    <path d="M105,9.8 A2.6,2.6 0 0 1 102.4,7.2"/>
    <path d="M103.4,5.6 A1.8,1.8 0 0 1 106.6,6"/>
    <path d="M106.6,8.8 A1.8,1.8 0 0 1 103.4,8.4"/>
  </g>
  <circle cx="105" cy="7.2" r=".75" fill="#d8f4ff"/>
  <g stroke="#f0a832" stroke-width=".45" stroke-linecap="round">
    <path d="M90,7.2 H96.5 M113.5,7.2 H120"/>
    <path d="M86.5,6.2 V8.2 M88.2,5.9 V8.5 M121.8,5.9 V8.5 M123.5,6.2 V8.2"/>
  </g>

  <!-- amber status lights on the chamfers -->
  <g>
    <circle cx="10" cy="10" r="2.4" fill="url(#ledGlow)"/>
    <circle cx="200" cy="10" r="2.4" fill="url(#ledGlow)"/>
    <circle cx="10" cy="287" r="2.4" fill="url(#ledGlow)"/>
    <circle cx="200" cy="287" r="2.4" fill="url(#ledGlow)"/>
  </g>
  <g fill="#f0a832">
    <circle cx="10" cy="10" r=".6"/>
    <circle cx="200" cy="10" r=".6"/>
    <circle cx="10" cy="287" r=".6"/>
    <circle cx="200" cy="287" r=".6"/>
  </g>

  <!-- the plate under the page number -->
  <g stroke="#8a6420" stroke-width=".35" stroke-linecap="round">
    <path d="M86,282.4 H96 M114,282.4 H124"/>
  </g>
</svg>
